[project]
name = "marshmellow"
version = "0.1.0"
description = "Hands-free voice-controlled desktop agent"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "tomli-w>=1.0",
    "PySide6>=6.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marshmellow"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# tools/spikes are one-off research scripts (own hygiene policy), not product code
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not manual'"
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
markers = [
    "manual: requires a real desktop / real apps (deselected by default)",
    "scenario: headless end-to-end scenario tests",
]

[tool.mypy]
python_version = "3.12"
packages = ["marshmellow.core"]
mypy_path = "src"
strict = true
