[project]
name = "marshmellow"
version = "0.1.0"
description = "Hands-free voice-controlled desktop agent"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "tomli-w>=1.0",
    "numpy>=2.0",
    "faster-whisper>=1.2",
    "piper-tts>=1.8",
    "openai>=1.50",
    "httpx>=0.27",
    "keyring>=25",
    "PySide6>=6.8",
    "openwakeword>=0.6",
    "sounddevice>=0.5",
    "uiautomation>=2.0.29",
    "mss>=9",
    "pillow>=10",
    "feedparser>=6.0",
]

[tool.uv]
# openwakeword declares tflite-runtime (Linux-only) but wheels exist only for
# cp38-cp311; scope it to python<3.12 so the universal lock resolves on 3.12+
# (onnx inference_framework is the supported path elsewhere).
override-dependencies = ["tflite-runtime; python_full_version < '3.12'"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]
# M5 Task 5 (D8): openwakeword's upstream custom-training flow (openwakeword.train)
# needs torch; the trainer tool imports it inside the training step only. Not part
# of the default env — `uv sync --group wake-training` before training.
# License note (04-tooling, Task 7 records): torch BSD-3, torchmetrics Apache-2.0,
# torchinfo MIT, pronouncing MIT, audiomentations/torch_audiomentations MIT,
# speechbrain Apache-2.0, acoustics BSD-3, mutagen GPL-2.0-or-later, onnx/onnxscript
# MIT (training-time only; the product never imports any of these — same boundary
# as piper).
wake-training = [
    "torch>=2.2",
    "torchmetrics>=1.0",
    "torchinfo>=1.1",
    "pronouncing>=0.2",
    "audiomentations>=0.34",
    "torch-audiomentations>=0.11",
    "speechbrain>=1.0",
    "mutagen>=1.46",
    "acoustics>=0.2",
    "onnx>=1.15",
    "onnxscript>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
marshmellow = "marshmellow.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/marshmellow"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# tools/spikes are one-off research scripts (own hygiene policy), not product code
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." on the path so tests can import the pure half of tools/ (M5 Task 5:
# manifest determinism + calibration math are headless-tested).
pythonpath = ["."]
addopts = "-m 'not manual'"
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
markers = [
    "manual: requires a real desktop / real apps (deselected by default)",
    "scenario: headless end-to-end scenario tests",
    "fixture_audio: uses the real STT model + recorded audio fixtures (slow)",
]

[tool.mypy]
python_version = "3.12"
packages = ["marshmellow.core", "marshmellow.perception", "marshmellow.actions",
            "marshmellow.testing", "marshmellow.safety", "marshmellow.planner",
            "marshmellow.tasks", "marshmellow.llm"]
mypy_path = "src"
strict = true

# uiautomation ships no stubs/py.typed; the real walker's Control objects are Any.
[[tool.mypy.overrides]]
module = "uiautomation"
ignore_missing_imports = true

# feedparser (M4 monitors) ships no stubs/py.typed; FeedParserDict is dict-like Any.
[[tool.mypy.overrides]]
module = "feedparser"
ignore_missing_imports = true
